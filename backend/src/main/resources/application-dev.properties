# Base de datos H2 en fichero (se crea sola en backend/data/)
spring.datasource.url=jdbc:h2:file:./data/azeroth;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Sirve el frontend directamente desde ../frontend (el backend se ejecuta desde la carpeta backend/)
spring.web.resources.static-locations=file:../frontend/,classpath:/static/
