<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azeroth Legends</title>
  <link rel="stylesheet" href="/css/cursor.css">
  <link rel="stylesheet" href="/css/questlog.css">
  <link rel="stylesheet" href="/css/index.css">
  <link rel="stylesheet" href="/css/animaciones.css">
  <link rel="stylesheet" href="/css/rustic.css">
</head>

<body class="bg-parchment font-fantasy text-dark">

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <button class="chat-button">
        <span class="chat-text">Abrir chat global ⏷</span>
        <span class="chat-icon">🌍</span>
      </button>
      <a href="/personajes" class="nav-link">Personajes</a>
    </div>

    <div class="header-center">
      <h1 class="title">Azeroth Legends</h1>
      <p class="brand-subtitle">Las crónicas de Azeroth</p>
    </div>

    <div class="header-right">
      <div class="perfil-dropdown">
        <button class="perfil-button" id="perfilToggle">
          <img src="/assets/profile-icon.png" alt="Perfil" class="perfil-img">
        </button>
        <div id="perfilMenuContainer"></div>
      </div>
      <p>Cuenta</p>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="main-layout">
    <!-- Imagen decorativa izquierda -->
    <aside class="character-image">
      <img id="imagenPersonaje1" alt="Personaje Alianza">
    </aside>

    <!-- Buscador -->
    <section class="busqueda">
      <p class="section-kicker">Tu próxima aventura comienza aquí</p>
      <h2 class="subtitle">Encuentra a tu héroe</h2>
      <p class="search-intro">Explora las crónicas de Azeroth. Busca un personaje por nombre, reino y era.</p>

      <form id="buscarForm" class="form-busqueda">
        <select name="region" id="regionSelect" hidden>
          <option value="eu" selected>EU</option>
        </select>

        <div class="form-group">
          <label for="version" class="label">Versión del juego</label>
          <select name="version" id="version" class="select" required>
            <option value="retail">Retail</option>
            <option value="classic_era">Classic Era</option>
            <option value="classic">Classic (Mists of Pandaria)</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="nombre" class="label">Nombre</label>
            <input type="text" name="nombre" id="nombre" class="input" required>
          </div>

          <div class="form-group">
            <label for="reinoSearch" class="label">Reino</label>
            <div class="realm-picker">
              <input type="hidden" name="reino" id="reinoSelect">
              <input type="search" id="reinoSearch" class="input" placeholder="Busca por nombre..." autocomplete="off"
                aria-autocomplete="list" aria-controls="reinoSuggestions" aria-expanded="false" required>
              <div id="reinoSuggestions" class="realm-suggestions" role="listbox" hidden></div>
              <p id="reinoStatus" class="realm-status" aria-live="polite">Escribe para ver sugerencias de reinos.</p>
            </div>
          </div>
        </div>

        <p id="mensajeError" class="mensaje-error" role="alert" hidden></p>

        <button type="submit" class="button" id="botonBuscar">Buscar personaje</button>
        <div id="loader" class="loader-overlay">
          <div class="loader" id="loader-anim" style="display: none;"></div>
        </div>
      </form>
    </section>

    <!-- Imagen decorativa derecha -->
    <aside class="character-image">
      <img id="imagenPersonaje2" alt="Personaje Horda">
    </aside>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2025 Azeroth Legends <span aria-hidden="true">·</span></p>
    <p>@darksig_</p>
  </footer>

  <!-- Scripts -->
  <script src="/js/comun.js"></script>
  <script src="/js/form.js"></script>
  <script src="/js/decoracion.js"></script>
  <script src="/js/desplegable-perfil.js"></script>
</body>

</html>
